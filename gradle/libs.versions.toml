[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
room = "2.6.1"
media3 = "1.5.1"
composeBom = "2024.12.01"
navigation = "2.8.5"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
coroutines = "1.9.0"
junit5 = "5.11.3"
turbine = "1.2.0"
junit4 = "4.13.2"
robolectric = "4.14.1"
androidxTest = "1.6.1"
ktlint = "12.1.2"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
